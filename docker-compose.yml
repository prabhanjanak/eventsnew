services:
  # ── Sankara Events Full-Stack Application ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sankara-events-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/events_db}
      - SESSION_SECRET=${SESSION_SECRET:-sankara_events_production_secure_session_key_2026}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
    volumes:
      # Persistent storage for uploaded agendas, gallery photos, and badges
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── PostgreSQL Database Service ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sankara-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-events_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-events_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
