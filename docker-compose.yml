services:
  # ── Sankara Events Full-Stack Application ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sankara-events-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      # Allows the container to seamlessly reach host PostgreSQL at host.docker.internal
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/vision2020}
      - SESSION_SECRET=${SESSION_SECRET:-sankara_events_production_secure_session_key_2026}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
      # Communication & AI Services
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      # Payment Gateway (Optional - configured via Admin UI / DB)
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      # SMTP Email Configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Sankara Eye Foundation India}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL:-}
      # Google OAuth & Google Wallet
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GOOGLE_WALLET_ISSUER_ID=${GOOGLE_WALLET_ISSUER_ID:-}
      - GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL=${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_WALLET_PRIVATE_KEY=${GOOGLE_WALLET_PRIVATE_KEY:-}
    volumes:
      # Persistent storage for uploaded agendas, gallery photos, and badges
      - ./uploads:/app/uploads

  # ── PostgreSQL Database Service (Optional - used only if host doesn't have PostgreSQL) ──
  db:
    image: postgres:16-alpine
    container_name: sankara-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision2020}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Mapped to 5433 on host to prevent port conflict with host's existing PostgreSQL on 5432
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-events_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
